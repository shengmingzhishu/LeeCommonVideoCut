        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                                items:
                                  type: array
                                  items: { $ref: '#/components/schemas/Task' }

  /api/tasks/{task_id}:
    parameters:
      - { in: path, name: task_id, required: true, schema: { type: string } }
    get:
      tags: [Tasks]
      summary: 任务详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Task' }
    delete:
      tags: [Tasks]
      summary: 取消任务
      responses:
        '200': { description: OK }

  /api/tasks/{task_id}/retry:
    post:
      tags: [Tasks]
      summary: 重试失败任务
      parameters:
        - { in: path, name: task_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Task' }

  # ---------- Files ----------
  /api/files/upload:
    post:
      tags: [Files]
      summary: 上传文件（multipart/form-data）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                sub_dir:
                  type: string
                  description: 存储子目录（可选，如 video / audio）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileUploadResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }

  /api/files:
    get:
      tags: [Files]
      summary: 我的文件列表（分页）
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 100 } }
        - { in: query, name: sub_dir, schema: { type: string }, description: 按子目录筛选 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageResponse' }

  /api/files/{file_id}:
    get:
      tags: [Files]
      summary: 文件详情
      parameters:
        - { in: path, name: file_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Files]
      summary: 删除文件（仅本人或管理员）
      parameters:
        - { in: path, name: file_id, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/files/{file_id}/preview:
    get:
      tags: [Files]
      summary: 文件预览（支持 Range 请求，供 video/audio 内联播放）
      parameters:
        - { in: path, name: file_id, required: true, schema: { type: string } }
        - { in: query, name: range, schema: { type: string }, description: Range 头（bytes=0-1023） }
      responses:
        '200':
          description: 完整文件流
          content:
            application/octet-stream: {}
        '206':
          description: 部分内容（Range）
          content:
            application/octet-stream: {}
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/files/{file_id}/download:
    get:
      tags: [Files]
      summary: 文件下载（attachment）
      parameters:
        - { in: path, name: file_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 文件下载流
          content:
            application/octet-stream: {}
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/dirs/browse:
    get:
      tags: [Files]
      summary: 浏览目录（受限 workdir 内）
      parameters:
        - { in: query, name: path, schema: { type: string }, description: 相对 workdir 的路径 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          current: { type: string }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                path: { type: string }
                                type: { type: string, enum: [parent, dir, file] }
                                size: { type: integer }
                                ext: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

