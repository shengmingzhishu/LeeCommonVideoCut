openapi: 3.0.3
info:
  title: 漫剧推广素材剪辑师 API v4.0
  description: |
    前后端分离的漫剧剪辑师后端 API。完整复刻旧版 7 步业务功能，
    并扩展用户体系、会员体系、管理员后台。

    **技术栈**：FastAPI + PostgreSQL 18 + SQLAlchemy 2.x + JWT

    **AI 模型**：MiniMax M3（OpenAI 兼容协议）

    **统一响应**：`{code, msg, data, traceId}`

    **错误码格式**：`{DOMAIN}_{HTTP_STATUS}_{SEQ}`

    **traceId**：每个请求注入，请求头 `X-Trace-Id` 回写
  version: 4.0.0
  contact:
    name: cut-server
    url: https://github.com/your-org/cut-server
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: 开发环境
  - url: https://api.cut.example.com
    description: 生产环境（占位）

tags:
  - name: System
    description: 系统
  - name: Auth
    description: 用户认证
  - name: Users
    description: 用户体系
  - name: Memberships
    description: 我的会员
  - name: Projects
    description: 项目管理
  - name: Episodes
    description: 剧集管理
  - name: Creations
    description: 创作流程
  - name: Step1
    description: Step1 创作信息（表单 + AI 大纲）
  - name: Step2
    description: Step2 口播长文（AI 生成 + TTS）
  - name: TTS
    description: TTS 音色目录与试听
  - name: Step3
    description: Step3 音视频素材（音频/视频列表 + 标记 + 合成）
  - name: Outputs
    description: 完成页（多次合成列表）
  - name: Tasks
    description: 异步任务轮询
  - name: Files
    description: 文件服务
  - name: Configs
    description: 配置
  - name: Admin/Users
    description: 管理员 - 用户管理
  - name: Admin/Memberships
    description: 管理员 - 会员分配
  - name: Admin/Configs
    description: 管理员 - 全局配置
  - name: Admin/AuditLogs
    description: 管理员 - 操作审计

# ============================================================
# 安全方案
# ============================================================
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token，30 天有效

  # ============================================================
  # 公共 Schema
  # ============================================================
  schemas:

    # ---------- 统一响应 ----------
    ApiResponse:
      type: object
      description: 统一响应包装
      required: [code, msg, data, traceId]
      properties:
        code:
          type: integer
          description: 业务状态码，0 = 成功
          example: 0
        msg:
          type: string
          description: 提示信息
          example: success
        data:
          description: 响应数据（任意类型）
        traceId:
          type: string
          description: 请求追踪 ID
          example: abc123def456

    PageResponse:
      type: object
      description: 分页响应
      required: [page, pageSize, total, items]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          example: 128
        items:
          type: array
          items: {}

    ErrorResponse:
      type: object
      description: 错误响应（按共享规则 03）
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
          description: 错误码，格式 `{DOMAIN}_{HTTP}_{SEQ}`
          example: PROJ_404_001
        message:
          type: string
          description: 面向用户的描述
          example: 项目不存在
        detail:
          type: string
          description: 面向开发者的详情
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time

    # ---------- 用户 ----------
    User:
      type: object
      properties:
        id: { type: string, example: u_abc123 }
        username: { type: string, example: zhangsan }
        email: { type: string, nullable: true, example: z@example.com }
        display_name: { type: string, nullable: true, example: 张三 }
        avatar_url: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        is_admin: { type: boolean, example: false }
        membership_tier: { type: string, enum: [free, pro, enterprise] }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 6, maxLength: 64, format: password }
        email: { type: string, format: email, nullable: true }
        display_name: { type: string, nullable: true }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, description: JWT token }
        expires_at: { type: string, format: date-time }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, minLength: 6, maxLength: 64, format: password }

    UserUpdate:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        bio: { type: string, nullable: true }

    # ---------- 会员 ----------
    Membership:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        tier: { type: string, enum: [free, pro, enterprise] }
        status: { type: string, enum: [active, expired, cancelled] }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        assigned_by: { type: string, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    QuotaInfo:
      type: object
      properties:
        tier: { type: string, enum: [free, pro, enterprise] }
        projects_limit: { type: integer, description: -1 = 无限 }
        projects_used: { type: integer }
        monthly_step_calls_limit: { type: integer, description: -1 = 无限 }
        monthly_step_calls_used: { type: integer }
        storage_limit_mb: { type: integer, description: -1 = 无限 }
        storage_used_mb: { type: number, format: float }
        current_period: { type: string, example: "2026-09" }

    # ---------- 项目 ----------
    Project:
      type: object
      properties:
        id: { type: string, example: p_abc123 }
        user_id: { type: string }
        title: { type: string }
        author: { type: string, nullable: true }
        intro: { type: string, nullable: true }
        cover: { type: string, example: "🎬" }
        video_dir: { type: string, nullable: true }
        intro_dir: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [title, author, intro]
      properties:
        title: { type: string, minLength: 1, maxLength: 128 }
        author: { type: string, minLength: 1, maxLength: 128 }
        intro: { type: string, minLength: 10, maxLength: 2000 }
        video_dir: { type: string, nullable: true }
        intro_dir: { type: string, nullable: true }
        cover: { type: string, default: "🎬" }
        video_file_ids:
          type: array
          description: 已上传的视频文件 ID；提供时由服务端解析为素材目录（优先于 video_dir）
          items: { type: string }

    ProjectUpdate:
      type: object
      properties:
        title: { type: string }
        author: { type: string }
        intro: { type: string }
        video_dir: { type: string }
        intro_dir: { type: string }
        cover: { type: string }
        status: { type: string, enum: [active, archived] }
        video_file_ids:
          type: array
          description: 已上传的视频文件 ID；提供时由服务端解析为素材目录（优先于 video_dir）
          items: { type: string }

    # ---------- 剧集 ----------
    Episode:
      type: object
      properties:
        id: { type: string, example: e_abc123 }
        project_id: { type: string }
        user_id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EpisodeCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, nullable: true }

    EpisodeUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }

    # ---------- 创作 ----------
    Creation:
      type: object
      properties:
        id: { type: string, example: c_abc123 }
        episode_id: { type: string }
        user_id: { type: string }
        title: { type: string, nullable: true }
        current_step: { type: integer, minimum: 1, maximum: 3 }
        status: { type: string, enum: [active, completed, failed, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreationCreate:
      type: object
      required: [episode_id]
      properties:
        episode_id: { type: string, description: 归属剧集 ID }
        title: { type: string, nullable: true }

    # ---------- 步骤结果 ----------
    StepResult:
      type: object
      properties:
        id: { type: string }
        creation_id: { type: string }
        step_no: { type: integer, minimum: 1, maximum: 3 }
        version: { type: integer }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- Step1 创作信息 ----------
    Step1Form:
      type: object
      description: 创作信息表单（持久化到 step_results.payload.form）
      properties:
        title: { type: string }
        author: { type: string }
        intro: { type: string }
        style: { type: string, default: 热血安利, description: 文案风格 }
        target_duration: { type: integer, default: 70, description: 目标口播时长（秒） }
        episode_ids:
          type: array
          items: { type: string }
          description: 关联剧集
        text_files:
          type: array
          items: { type: string }
          description: 关联文本资料路径
        keywords:
          type: array
          items: { type: string }
          description: 用户自定义关键词
        ref_titles:
          type: array
          items: { type: string }
          description: 用户参考标题
        value_points:
          type: array
          items: { type: string }
          description: 用户补充价值点
        goals:
          type: array
          items: { type: string, enum: [intro_episode, random_story, random_character, random_perspective] }
          description: 快捷选项

    Step1Outline:
      type: object
      description: AI 生成的大纲
      properties:
        core_keywords:
          type: array
          items: { type: string }
        core_words:
          type: array
          items: { type: string }
        ref_titles:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              subtitle: { type: string }
        main_task: { type: string }
        core_value:
          type: array
          items: { type: string }
        keypoints:
          type: array
          items: { type: string }

    Step1OutlineRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        form: { $ref: '#/components/schemas/Step1Form' }

    Step1OutlineResponse:
      type: object
      properties:
        outline: { $ref: '#/components/schemas/Step1Outline' }

    Step1SaveRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        form: { $ref: '#/components/schemas/Step1Form' }
        outline: { $ref: '#/components/schemas/Step1Outline' }

    Step1SaveResponse:
      type: object
      properties:
        creation_id: { type: string }
        current_step: { type: integer }
        form: { $ref: '#/components/schemas/Step1Form' }
        outline: { $ref: '#/components/schemas/Step1Outline' }

    # ---------- TTS 音色 ----------
    TTSVoice:
      type: object
      description: 音色目录项（13 个中文风格预设，底层神经网络发音人 8 个）
      properties:
        id: { type: string, example: female_sweet }
        name: { type: string, example: 甜美少女 }
        gender: { type: string, enum: [male, female] }
        style: { type: string, example: 甜美亲和 }
        voice: { type: string, example: zh-CN-XiaoxiaoNeural, description: 底层发音人名 }
        rate: { type: integer, description: 相对语速偏移（%），-100~200, example: 0 }
        pitch: { type: integer, description: 音调偏移（Hz），-50~50, example: 0 }
        volume: { type: integer, description: 音量偏移（%），-100~100, example: 0 }
        description: { type: string }

    TTSSegment:
      type: object
      description: 段落音色配置（未填字段回落到全局配置）
      required: [text]
      properties:
        index: { type: integer, minimum: 0, default: 0 }
        text: { type: string, minLength: 1, maxLength: 4000 }
        voice_id: { type: string, nullable: true, example: male_magnetic }
        rate: { type: integer, minimum: -100, maximum: 200, default: 0 }
        pitch: { type: integer, minimum: -50, maximum: 50, default: 0 }
        volume: { type: integer, minimum: -100, maximum: 100, default: 0 }
        pause_after_ms: { type: integer, minimum: 0, maximum: 3000, default: 0, description: 本段后停顿毫秒 }

    TTSConfig:
      type: object
      description: 整篇 TTS 配置（全局音色 + 段落覆盖）
      properties:
        provider: { type: string, default: edge-tts, description: 首选 provider，如 edge-tts / azure / minimax / volcano }
        global_voice_id: { type: string, default: female_sweet }
        rate: { type: integer, minimum: -100, maximum: 200, default: 0 }
        pitch: { type: integer, minimum: -50, maximum: 50, default: 0 }
        volume: { type: integer, minimum: -100, maximum: 100, default: 0 }
        paragraph_gap_ms: { type: integer, minimum: 0, maximum: 3000, default: 300 }
        segments:
          type: array
          items: { $ref: '#/components/schemas/TTSSegment' }

    TTSPreviewRequest:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 200, default: 这是一段音色试听，欢迎使用漫剧推广素材剪辑师。 }
        voice_id: { type: string, default: female_sweet }
        rate: { type: integer, minimum: -100, maximum: 200, default: 0 }
        pitch: { type: integer, minimum: -50, maximum: 50, default: 0 }
        volume: { type: integer, minimum: -100, maximum: 100, default: 0 }

    # ---------- Step2 口播长文 ----------
    Step2GenerateRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        title: { type: string, nullable: true, description: 标题，不传则用 Step1 大纲中的 }
        subtitle: { type: string, nullable: true }

    Step2GenerateResponse:
      type: object
      properties:
        title: { type: string }
        content: { type: string, description: 口播长文正文（纯文本） }
        word_count: { type: integer }
        tts_config: { $ref: '#/components/schemas/TTSConfig' }

    Step2SaveRequest:
      type: object
      required: [creation_id, content]
      properties:
        creation_id: { type: string }
        title: { type: string }
        content: { type: string }
        word_count: { type: integer }
        skip_tts: { type: boolean, default: false, description: 跳过自动 TTS（改用上传录音） }
        tts_config: { $ref: '#/components/schemas/TTSConfig' }

    Step2SaveResponse:
      type: object
      properties:
        creation_id: { type: string }
        current_step: { type: integer }
        tts_task_id: { type: string, nullable: true, description: 异步 TTS 任务 ID }

    # ---------- Step3 音视频素材 ----------
    AudioItem:
      type: object
      properties:
        path: { type: string, description: 服务端相对路径（不含绝对路径） }
        name: { type: string }
        duration: { type: number, format: float }
        duration_str: { type: string }
        source: { type: string, enum: [system, custom], description: system=AI 生成，custom=用户上传 }
        selected: { type: boolean }

    VideoItem:
      type: object
      properties:
        name: { type: string }
        duration: { type: number, format: float }
        duration_str: { type: string }
        selected: { type: boolean }

    TransitionConfig:
      type: object
      description: 转场配置（ffmpeg xfade）
      properties:
        type: { type: string, enum: [none, fade, slide, zoom], default: none }
        duration: { type: number, format: float, minimum: 0.2, maximum: 1.5, default: 0.5 }

    AvatarConfig:
      type: object
      description: 主持人人像叠加（圆形裁切 + 描边/阴影 + 出现时间段）
      properties:
        file_id: { type: string, nullable: true, description: 已上传图片文件 ID }
        position: { type: string, enum: [top_left, top_right, bottom_left, bottom_right], default: bottom_right }
        size_ratio: { type: number, format: float, minimum: 0.05, maximum: 0.5, default: 0.18, description: 头像边长占画面短边比例 }
        border_color: { type: string, default: "#FFFFFF" }
        border_width: { type: integer, minimum: 0, maximum: 20, default: 4 }
        shadow: { type: boolean, default: true }
        start: { type: number, format: float, minimum: 0, default: 0, description: 出现开始秒 }
        end: { type: number, format: float, nullable: true, description: 出现结束秒，null=全程 }

    QualityConfig:
      type: object
      description: 成片质量预设
      properties:
        resolution: { type: string, pattern: '^\d+x\d+$', default: "1080x1920" }
        crf: { type: integer, minimum: 18, maximum: 32, default: 23 }
        preset: { type: string, enum: [ultrafast, veryfast, fast, medium, slow], default: medium }

    BGMConfig:
      type: object
      description: 背景音乐（音量比例 + 人声闪避 + 首尾淡入淡出）
      properties:
        file_id: { type: string, nullable: true, description: 已上传 BGM 文件 ID }
        volume: { type: integer, minimum: 0, maximum: 100, default: 30, description: BGM 基准音量百分比 }
        ducking: { type: boolean, default: true, description: 人声出现时自动压低音乐 }
        duck_level: { type: integer, minimum: 5, maximum: 100, default: 30, description: 闪避后保留的音乐百分比 }
        fade_in: { type: number, format: float, minimum: 0, maximum: 5, default: 0.6 }
        fade_out: { type: number, format: float, minimum: 0, maximum: 5, default: 0.8 }
        loop: { type: boolean, default: true, description: BGM 短于成片时循环 }

    IntroOutroItem:
      type: object
      description: 片头 / 片尾字卡
      properties:
        enabled: { type: boolean, default: false }
        title: { type: string, maxLength: 40 }
        subtitle: { type: string, maxLength: 60 }
        duration: { type: number, format: float, minimum: 1, maximum: 8, default: 3 }
        background_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: "#0F1117" }
        text_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: "#FFFFFF" }
        image_file_id: { type: string, nullable: true, description: 背景图文件 ID；为空则纯色 }

    IntroOutroConfig:
      type: object
      description: 片头片尾配置
      properties:
        intro: { $ref: '#/components/schemas/IntroOutroItem' }
        outro: { $ref: '#/components/schemas/IntroOutroItem' }

    CoverExportRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        output_path: { type: string, nullable: true, description: 成片路径；为空取最新成片 }
        time: { type: number, format: float, minimum: 0, nullable: true, description: 截取时间点（秒），默认 1.0 }

    VideoMark:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, description: 视频文件名 }
        start: { type: number, format: float }
        end: { type: number, format: float }
        duration: { type: number, format: float }
        muted: { type: boolean, default: true }
        transition: { $ref: '#/components/schemas/TransitionConfig' }

    Step3MediaListResponse:
      type: object
      properties:
        system_audios:
          type: array
          items: { $ref: '#/components/schemas/AudioItem' }
        custom_audios:
          type: array
          items: { $ref: '#/components/schemas/AudioItem' }
        video_files:
          type: array
          items: { $ref: '#/components/schemas/VideoItem' }
        deleted_audio_paths:
          type: array
          items: { type: string }
        deleted_video_paths:
          type: array
          items: { type: string }

    Step3RemarkRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        video_files:
          type: array
          items: { type: string }
          description: 参与标记的视频文件名（为空则用全部）
        target_duration:
          type: integer
          nullable: true
          description: 目标总时长（秒），为空则按音频时长自动推导

    Step3RemarkResponse:
      type: object
      properties:
        markers_path: { type: string }
        marker_count: { type: integer }
        total_duration: { type: number, format: float }
        sources_used:
          type: array
          items: { type: string }
        video_files:
          type: array
          items: { $ref: '#/components/schemas/VideoItem' }
        markers:
          type: array
          items: { $ref: '#/components/schemas/VideoMark' }

    Step3SaveStateRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        audio_files:
          type: array
          items: { $ref: '#/components/schemas/AudioItem' }
        video_files:
          type: array
          items: { $ref: '#/components/schemas/VideoItem' }
        deleted_media:
          type: object
          properties:
            audio_paths:
              type: array
              items: { type: string }
            video_paths:
              type: array
              items: { type: string }
        compose_settings:
          type: object
          additionalProperties: true
          description: 转场 / 主持人人像 / 质量预设的持久化配置

    Step3SaveStateResponse:
      type: object
      properties:
        creation_id: { type: string }
        current_step: { type: integer }

    Step3VideoSourcesRequest:
      type: object
      required: [creation_id, file_ids]
      properties:
        creation_id: { type: string }
        file_ids:
          type: array
          minItems: 1
          items: { type: string }
          description: 已上传的视频文件 ID（服务端解析为公共素材目录）

    SubtitleStyleSpec:
      type: object
      required: [name, force_style, font_size, margin_v, alignment, outline, border_style]
      properties:
        name: { type: string, description: 模板名称 }
        force_style: { type: string, description: ffmpeg force_style 原文 }
        font_size: { type: integer, description: ASS 字号（PlayResY=288 基准） }
        margin_v: { type: integer, description: ASS 垂直边距（底部/顶部） }
        alignment: { type: integer, description: ASS 对齐（2=底部居中等） }
        outline: { type: number, description: 描边宽度 }
        border_style: { type: integer, description: 1=描边 3=不透明底框 4=底框 }
        primary_colour: { type: string, description: ASS 主色 &HAABBGGRR }
        outline_colour: { type: string, description: ASS 描边色 }
        back_colour: { type: string, description: ASS 底框色 }

    Step3ComposeRequest:
      type: object
      required: [creation_id]
      properties:
        creation_id: { type: string }
        audio_files:
          type: array
          items: { type: string }
          description: 选中的音频相对路径
        markers:
          type: array
          items: { $ref: '#/components/schemas/VideoMark' }
        fast_mode: { type: boolean, default: false, description: true=单条 ffmpeg concat filter }
        resolution: { type: string, default: "1080x1920" }
        subtitle_style: { type: string, default: 默认白字黑描边 }
        global_transition: { $ref: '#/components/schemas/TransitionConfig' }
        avatar: { $ref: '#/components/schemas/AvatarConfig' }
        quality: { $ref: '#/components/schemas/QualityConfig' }
        bgm: { $ref: '#/components/schemas/BGMConfig' }
        intro_outro: { $ref: '#/components/schemas/IntroOutroConfig' }

    Step3ComposeResponse:
      type: object
      properties:
        task_id: { type: string, description: 异步合成任务 ID }

    # ---------- 完成页 ----------
    Output:
      type: object
      properties:
        id: { type: string }
        creation_id: { type: string }
        version: { type: integer }
        output_path: { type: string, description: 成品相对路径 }
        duration: { type: number, format: float }
        duration_str: { type: string }
        file_size: { type: integer, format: int64 }
        resolution: { type: string }
        is_latest: { type: boolean }
        created_at: { type: string, format: date-time }

    # ---------- 任务 ----------
    Task:
      type: object
      properties:
        id: { type: string, example: t_abc123 }
        user_id: { type: string }
        type: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        payload: { type: object }
        result: { type: object, nullable: true }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- 文件 ----------
    FileUploadResponse:
      type: object
      properties:
        id: { type: string }
        filename: { type: string, description: 实际存储的文件名（冲突时自动加序号） }
        path: { type: string, description: 相对用户上传目录的路径 }
        size_bytes: { type: integer }
        mime_type: { type: string }

    FileMeta:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        path: { type: string, description: 相对用户上传目录的路径 }
        size_bytes: { type: integer }
        mime_type: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- 配置 ----------
    Config:
      type: object
      properties:
        key: { type: string }
        user_id: { type: string, nullable: true, description: NULL = 全局 }
        value: { type: object }
        description: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }

    ConfigUpdate:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: object }
        description: { type: string, nullable: true }

    ConfigTest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [minimax, deepseek, bing_search] }
        api_key: { type: string }
        base_url: { type: string, nullable: true }
        model: { type: string, nullable: true }

    ConfigTestResult:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        latency_ms: { type: integer, nullable: true }

    # ---------- 审计 ----------
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        admin_user_id: { type: string }
        admin_username: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, nullable: true }
        payload: { type: object }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

  # ============================================================
  # 公共响应
  # ============================================================
  responses:
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: AUTH_401_001
            message: 未登录，请先登录
            traceId: abc123
            timestamp: 2026-09-08T10:30:00Z
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: ADMIN_403_001
            message: 仅管理员可访问
            traceId: abc123
            timestamp: 2026-09-08T10:30:00Z
    QuotaExceeded:
      description: 会员配额不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: MEMBER_402_001
            message: 会员配额不足，请联系管理员升级
            traceId: abc123
            timestamp: 2026-09-08T10:30:00Z
    ValidationError:
      description: 请求参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

# ============================================================
# 路径
# ============================================================
paths:

  # ---------- System ----------
  /api/health:
    get:
      tags: [System]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          ffmpeg_available: { type: boolean }
                          ffprobe_available: { type: boolean }
                          postgres_available: { type: boolean }
                          minimax_available: { type: boolean }
                          version: { type: string, example: 4.0.0 }

  # ---------- Auth ----------
  /api/auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '200':
          description: 注册成功，自动登录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: 修改自己的密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------- Users ----------
  /api/users/me:
    get:
      tags: [Users]
      summary: 获取当前用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
    put:
      tags: [Users]
      summary: 更新当前用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }

  /api/users/me/projects:
    get:
      tags: [Users]
      summary: 我的项目列表
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageResponse' }

  # ---------- Memberships (我的) ----------
  /api/memberships/me:
    get:
      tags: [Memberships]
      summary: 我的会员状态
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Membership' }

  /api/memberships/me/quota:
    get:
      tags: [Memberships]
      summary: 我的配额使用
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuotaInfo' }

  # ---------- Projects ----------
  /api/projects:
    get:
      tags: [Projects]
      summary: 项目列表（分页）
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20 } }
        - { in: query, name: keyword, schema: { type: string }, description: 搜索关键字 }
        - { in: query, name: status, schema: { type: string, enum: [active, archived] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [Projects]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Project' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/projects/{project_id}:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
    get:
      tags: [Projects]
      summary: 项目详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      summary: 更新项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Project' }
    delete:
      tags: [Projects]
      summary: 删除项目
      responses:
        '200': { description: OK }

  /api/projects/{project_id}/copy:
    post:
      tags: [Projects]
      summary: 复制项目（含剧集+创作）
      parameters:
        - { in: path, name: project_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Project' }

  # ---------- Episodes ----------
  /api/projects/{project_id}/episodes:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
    get:
      tags: [Episodes]
      summary: 剧集列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Episode' }
    post:
      tags: [Episodes]
      summary: 创建剧集
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EpisodeCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Episode' }

  /api/projects/{project_id}/episodes/{episode_id}:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
      - { in: path, name: episode_id, required: true, schema: { type: string } }
    get:
      tags: [Episodes]
      summary: 剧集详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Episode' }
    put:
      tags: [Episodes]
      summary: 更新剧集
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EpisodeUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Episode' }
    delete:
      tags: [Episodes]
      summary: 删除剧集
      responses:
        '200': { description: OK }

  # ---------- Creations ----------
  /api/projects/{project_id}/creations:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
    get:
      tags: [Creations]
      summary: 创作列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Creation' }
    post:
      tags: [Creations]
      summary: 创建创作
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Creation' }

  /api/projects/{project_id}/creations/{creation_id}:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
      - { in: path, name: creation_id, required: true, schema: { type: string } }
    get:
      tags: [Creations]
      summary: 创作详情（含所有 step 结果）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Creation'
                          - type: object
                            properties:
                              step_results:
                                type: object
                                additionalProperties: { $ref: '#/components/schemas/StepResult' }
                                description: 按 step_no 索引的各步当前结果
    delete:
      tags: [Creations]
      summary: 删除创作
      responses:
        '200': { description: OK }

  /api/projects/{project_id}/creations/{creation_id}/step-results/{step_no}:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
      - { in: path, name: creation_id, required: true, schema: { type: string } }
      - { in: path, name: step_no, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    get:
      tags: [Creations]
      summary: 获取某 Step 当前结果
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StepResult' }

  /api/projects/{project_id}/creations/{creation_id}/history/{step_no}:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
      - { in: path, name: creation_id, required: true, schema: { type: string } }
      - { in: path, name: step_no, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    get:
      tags: [Creations]
      summary: 获取某 Step 历史版本列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StepResult' }

  /api/projects/{project_id}/creations/{creation_id}/rollback/{step_no}/{version}:
    parameters:
      - { in: path, name: project_id, required: true, schema: { type: string } }
      - { in: path, name: creation_id, required: true, schema: { type: string } }
      - { in: path, name: step_no, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
      - { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Creations]
      summary: 回滚到指定历史版本（复制为最新版本，不删除历史）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StepResult' }
        '404':
          description: 历史版本不存在

  # ============================================================
  # Step1 创作信息
  # ============================================================
  /api/step1/outline:
    post:
      tags: [Step1]
      summary: Step1 生成大纲（AI 拆解 + 价值点 + 参考标题）
      description: 根据创作信息表单与关联资料生成大纲，不落库，前端可反复重新生成。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step1OutlineRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step1OutlineResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/step1/save:
    post:
      tags: [Step1]
      summary: Step1 保存创作信息与大纲
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step1SaveRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step1SaveResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/step1/load:
    get:
      tags: [Step1]
      summary: Step1 读取已保存的创作信息与大纲
      parameters:
        - { in: query, name: creation_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step1SaveResponse' }

  # ============================================================
  # Step2 口播长文
  # ============================================================
  /api/step2/generate:
    post:
      tags: [Step2]
      summary: Step2 生成口播长文（纯文本）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step2GenerateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step2GenerateResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }

  /api/step2/save:
    post:
      tags: [Step2]
      summary: Step2 保存口播长文（可触发异步 TTS）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step2SaveRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step2SaveResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }

  /api/step2/load:
    get:
      tags: [Step2]
      summary: Step2 读取已保存的口播长文
      parameters:
        - { in: query, name: creation_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step2GenerateResponse' }

  # ============================================================
  # TTS 音色
  # ============================================================
  /api/tts/voices:
    get:
      tags: [TTS]
      summary: 获取音色目录（13 个中文风格预设）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TTSVoice' }

  /api/tts/preview:
    post:
      tags: [TTS]
      summary: 音色试听（返回 audio/mpeg 音频流）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TTSPreviewRequest' }
      responses:
        '200':
          description: 试听音频
          content:
            audio/mpeg:
              schema: { type: string, format: binary }

  # ============================================================
  # Step3 音视频素材
  # ============================================================
  /api/step3/media-list:
    get:
      tags: [Step3]
      summary: Step3 获取音频与视频素材列表
      parameters:
        - { in: query, name: creation_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step3MediaListResponse' }

  /api/step3/preview:
    get:
      tags: [Step3]
      summary: 串播预览（音频/视频素材，支持 Range）
      parameters:
        - { in: query, name: creation_id, required: true, schema: { type: string } }
        - { in: query, name: scope, required: true, schema: { type: string, enum: [video, audio] } }
        - { in: query, name: name, required: true, schema: { type: string } }
      responses:
        '200':
          description: 媒体文件流
          content:
            video/mp4:
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
        '404':
          description: 文件不存在

  /api/step3/remark:
    post:
      tags: [Step3]
      summary: Step3 对勾选视频重新随机标记
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step3RemarkRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step3RemarkResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }

  /api/step3/save-state:
    post:
      tags: [Step3]
      summary: Step3 保存素材选择状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step3SaveStateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step3SaveStateResponse' }

  /api/step3/video-sources:
    post:
      tags: [Step3]
      summary: 绑定批量上传的视频素材到当前创作
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step3VideoSourcesRequest' }
      responses:
        '200':
          description: 返回最新视频素材列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          video_files:
                            type: array
                            items: { $ref: '#/components/schemas/VideoItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/step3/subtitle-styles:
    get:
      tags: [Step3]
      summary: 字幕模板清单 + 烧录端真实参数
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SubtitleStyleSpec' }

  /api/step3/compose:
    post:
      tags: [Step3]
      summary: Step3 一键合成（裁切 + 合并 + 音视频合成 + 字幕，长任务异步）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Step3ComposeRequest' }
      responses:
        '200':
          description: 返回 task_id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Step3ComposeResponse' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }

  /api/step3/cover:
    post:
      tags: [Step3]
      summary: 封面帧导出（从成片指定时间点返回 JPEG）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverExportRequest' }
      responses:
        '200':
          description: JPEG 封面图
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # 完成页
  # ============================================================
  /api/creations/{creation_id}/outputs:
    get:
      tags: [Outputs]
      summary: 完成页 - 该创作的多次合成列表（最新置顶）
      parameters:
        - { in: path, name: creation_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Output' }

  /api/creations/{creation_id}/outputs/{output_id}/file:
    parameters:
      - { in: path, name: creation_id, required: true, schema: { type: string } }
      - { in: path, name: output_id, required: true, schema: { type: string } }
    get:
      tags: [Outputs]
      summary: 成片在线预览 / 下载（校验创作归属）
      parameters:
        - in: query
          name: download
          schema: { type: boolean, default: false }
          description: true = 附件下载，false = 在线预览
      responses:
        '200':
          description: 视频二进制流（video/mp4，支持 Range）
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- Tasks ----------
  /api/tasks:
    get:
      tags: [Tasks]
