[project]
name = "cut-server"
version = "4.0.0"
description = "漫剧推广素材剪辑师后端 · FastAPI + PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 数据库
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    # 鉴权
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    # 异步 / HTTP
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    # AI / TTS
    "openai>=1.50.0",          # MiniMax M3 兼容
    "edge-tts>=6.1.18",
    "pyttsx3>=2.90",            # Windows 兜底
    # 视频处理
    "ffmpeg-python>=0.2.0",
    # 工具
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # 测试用
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.10.0",
    "faker>=30.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003：中文全角标点误报（项目文档与注释全中文，禁用）
# B008：FastAPI Depends() 默认值是官方推荐写法
ignore = ["E501", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许断言与打印
"tests/**" = ["F401", "F841", "UP037"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
testpaths = ["tests"]